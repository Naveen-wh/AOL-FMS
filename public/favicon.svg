<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" fill="none">
  <!-- Centered AOL Brand Logo for Square Favicon -->
  <g transform="translate(0, 80)">
    <!-- Letter A -->
    <text x="42" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="112" fill="#18181B" text-anchor="middle">A</text>

    <!-- Vertically aligned red hexagon -->
    <polygon points="170,22 225,55 225,125 170,158 115,55" fill="#B83228"/>

    <!-- White ring inside red hexagon (Letter O) -->
    <circle cx="170" cy="90" r="28" fill="none" stroke="#FFFFFF" stroke-width="13"/>

    <!-- Letter L -->
    <text x="292" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="112" fill="#18181B" text-anchor="middle">L</text>
  </g>
</svg>
